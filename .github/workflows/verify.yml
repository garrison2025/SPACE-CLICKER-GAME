name: Verify build

on:
  push:
    branches:
      - main
      - fix/spacebar-seo-suite-20261005
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Generate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency lock once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked and current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit dependency lock"
          git push
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/test-project-storage.mjs
      - run: node scripts/test-middleware.mjs
