name: Verify build

on:
  push:
    branches:
      - main
      - fix/spacebar-seo-suite-20261005
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
